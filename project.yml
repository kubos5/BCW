# Alternativa al progetto incluso: `brew install xcodegen && xcodegen generate`
name: BCW
options:
  bundleIdPrefix: com.bcw
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: it
targets:
  BCW:
    type: application
    platform: iOS
    sources: [BCW]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bcw.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: BCW
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSFaceIDUsageDescription: "BCW usa Face ID per proteggere l'accesso al tuo registro elettronico."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
