# Alternativa al progetto incluso: `brew install xcodegen && xcodegen generate`
name: BCW
options:
  bundleIdPrefix: com.bcw
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: it
targets:
  BCW:
    type: application
    supportedDestinations: [iOS]
    # `Shared`: codice comune all'app e ai widget (dati dei widget, giorno dell'orario, viste dei widget
    # e dell'attività in diretta).
    sources: [BCW, Shared]
    dependencies:
      # L'estensione dei widget e dell'attività in diretta, incorporata nell'app (PlugIns).
      - target: BCWWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bcw.app
        # App Group condiviso con i widget (group.com.bcw-classeviva.app).
        CODE_SIGN_ENTITLEMENTS: Config/BCW.entitlements
        MARKETING_VERSION: "3.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # iOS: aggiornamento in background (notifiche delle novità e attività in diretta), collegamenti
        # bcw:// dei widget e NSSupportsLiveActivities.
        "INFOPLIST_FILE[sdk=iphone*]": Config/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Icone alternative (Impostazioni › Aspetto › Icona dell'app, catalogo AppIcons.xcassets).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: BCW
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSFaceIDUsageDescription: "BCW usa Face ID per proteggere l'accesso al tuo registro elettronico."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "BCW aggiunge compiti, verifiche ed eventi al tuo calendario quando lo chiedi."
        INFOPLIST_KEY_NSHumanReadableCopyright: "BCW non è affiliata a Gruppo Spaggiari Parma."
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  BCWWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources: [BCWWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bcw.app.widgets
        MARKETING_VERSION: "3.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # NSExtension (com.apple.widgetkit-extension) unito all'Info.plist generato.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info-Widgets.plist
        INFOPLIST_KEY_CFBundleDisplayName: BCW
        INFOPLIST_KEY_NSHumanReadableCopyright: "BCW non è affiliata a Gruppo Spaggiari Parma."
        CODE_SIGN_ENTITLEMENTS: Config/BCWWidgets.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
